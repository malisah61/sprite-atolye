name: Modal motorunu kur

on:
  push:
    branches: [main]
    paths: ['modal/**', '.github/workflows/modal.yml']
  workflow_dispatch:
    inputs:
      test:
        description: 'Kurulumdan sonra deneme üretimi yap'
        type: boolean
        default: true
      tam:
        description: 'Tam test (tüm özellikler, ~30-50 dk, ~0,3 $). Kapalıysa hızlı duman testi (~5-8 dk)'
        type: boolean
        default: false

permissions:
  contents: write

# 23 Kasım (kullanıcı kararı: motor işleri tek oturumdan): aynı anda tek kurulum + test. Yeni gönderim gelirse
# eski kurulum/test iptal edilir (eski kodun testi tek GPU'yu meşgul edip kredi yemesin).
concurrency:
  group: modal-motor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SPRITE_KEY: ${{ secrets.SPRITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        id: chk
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::warning::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET eklenmemiş — kurulum atlandı."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$SPRITE_KEY" ]; then echo "::warning::SPRITE_KEY yok — motor herkese açık olur!"; fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.ok == 'true'
        with:
          python-version: '3.11'

      - name: Modal kur
        if: steps.chk.outputs.ok == 'true'
        run: pip install --quiet modal

      - name: Anahtarı Modal'a yükle
        if: steps.chk.outputs.ok == 'true'
        run: modal secret create sprite-key "SPRITE_KEY=${SPRITE_KEY}" --force

      - name: Motoru kur (deploy)
        if: steps.chk.outputs.ok == 'true'
        run: |
          set -o pipefail
          modal deploy modal/app.py 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+motor-web[a-zA-Z0-9.-]*\.modal\.run' deploy.log | head -1)
          AURL=$(grep -oE 'https://[a-zA-Z0-9.-]+animator-web[a-zA-Z0-9.-]*\.modal\.run' deploy.log | head -1)
          echo "MOTOR_URL=$URL" >> "$GITHUB_ENV"
          echo "ANIM_URL=$AURL" >> "$GITHUB_ENV"
          echo "### Motor adresi: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### Animasyon motoru: $AURL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deneme üretimi (hızlı duman testi; elle "tam" seçilirse tüm özellikler)
        if: steps.chk.outputs.ok == 'true' && (github.event_name == 'push' || inputs.test)
        env:
          TEST_KIP: ${{ inputs.tam && 'tam' || 'hizli' }}
        run: |
          pip install --quiet pillow
          python3 modal/test_motor.py

      - name: Deneme görsellerini repoya kaydet (deneme-sonuclari dalı)
        if: steps.chk.outputs.ok == 'true' && always()
        run: |
          ls test_*.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cp test_*.png /tmp/out/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin deneme-sonuclari 2>/dev/null && git checkout -B deneme-sonuclari origin/deneme-sonuclari || git checkout --orphan deneme-sonuclari
          # 23 Kasım: eskiden dalın tamamı silinip sadece deneme/ bırakılıyordu → sipariş, üretim ve animasyon
          # çıktıları her motor kurulumunda daldan kayboluyordu. Artık sadece ekleniyor.
          D="deneme/$(date -u +%Y%m%d-%H%M%S)"; mkdir -p "$D"; cp /tmp/out/*.png "$D/"
          git add deneme && git commit -qm "Deneme görselleri $D" && git push -q origin deneme-sonuclari

      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == 'true' && always()
        with:
          name: deneme-gorselleri
          path: |
            test_*.png
            deploy.log
          if-no-files-found: ignore
