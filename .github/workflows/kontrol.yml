name: Servis kontrolü
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - name: Metin servisi (Pollinations)
        run: |
          Q='Turn this Turkish game character description into a short English visual description, only visible traits, one line: güçlü herşeyi yapabilen, az yorgun, mutlu, orta boylu, düz saçlı, orta kilolu, siyah saçlı, beyaz tenli erkek'
          curl -sS -G --max-time 60 "https://text.pollinations.ai/" --data-urlencode "x=1" -o /dev/null -w "kök %{http_code}\n" || true
          python3 - "$Q" <<'PY'
          import sys, urllib.parse, urllib.request, time
          q = sys.argv[1]
          for url in ["https://text.pollinations.ai/" + urllib.parse.quote(q)]:
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"Origin": "https://malisah61.github.io", "Referer": "https://malisah61.github.io/sprite-atolye/"}), timeout=60)
                  print(r.status, round(time.time() - t, 1), "sn", "CORS:", r.headers.get("Access-Control-Allow-Origin"))
                  print(r.read().decode()[:600])
              except Exception as e:
                  print("HATA", e)
          PY
