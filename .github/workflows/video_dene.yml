name: Video dene

# Hareketli mini çizgi film denemesi: ilk kare kendi motorumuzla (çizgi film LoRA + referans karakter),
# sonra Wan 2.2 TI2V-5B (Apache-2.0) ile sahne sahne hareketli video; klipler birbirine bağlanır.
# Sonuç: deneme-sonuclari dalında video/<tarih>/ altına.
on:
  workflow_dispatch:
    inputs:
      sahneler:
        description: 'Sahneler (JSON: [{"ilk": "ilk kare tarifi", "prompt": "hareket", "kamera": "sabit|takip|yaklas"}])'
        default: '[{"ilk": "young woman adventurer with long red hair, green tunic, brown belt and brown boots, walking on a sunny forest path, full body, side view, 2D cartoon animation still, colorful cartoon forest background with trees, clean bold outlines, flat colors", "prompt": "2D cartoon animation, the red-haired young woman walks along the forest path with a smooth natural walking cycle, hair and tunic swaying gently", "kamera": "sabit"}, {"ilk": "young woman adventurer with long red hair, green tunic, brown belt and brown boots, standing still on a forest path and looking to the side curiously, full body, three-quarter view, 2D cartoon animation still, colorful cartoon forest background with trees, clean bold outlines, flat colors", "prompt": "2D cartoon animation, the red-haired young woman slowly turns her head left and right looking around curiously, blinks, leaves gently falling", "kamera": "sabit"}, {"ilk": "young woman adventurer with long red hair, green tunic, brown belt and brown boots, holding a steel sword raised in a brave heroic pose in a forest clearing, determined face, full body, front view, 2D cartoon animation still, colorful cartoon forest background with trees, clean bold outlines, flat colors", "prompt": "2D cartoon animation, the red-haired young woman slowly raises her sword higher in a brave heroic pose, wind gently blowing her hair and tunic", "kamera": "sabit"}]'
      seed:
        default: '42'

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SPRITE_KEY: ${{ secrets.SPRITE_KEY }}
      MOTOR_URL: https://malisah61--sprite-atolye-motor-web.us-east.modal.run
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --quiet modal
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - name: Referans karakteri al (önceki çizgi film çıktısı)
        run: |
          git fetch -q --depth 1 origin deneme-sonuclari
          F=$(git ls-tree -r --name-only FETCH_HEAD | grep 'kars_lora_cizgi_film_cartoon.png' | tail -1)
          [ -n "$F" ] && git show "FETCH_HEAD:$F" > referans.png && echo "referans: $F" || true
      - name: Sahne listesini yaz
        run: |
          cat > sahneler.json <<'JSON'
          ${{ inputs.sahneler }}
          JSON
          python3 -c "import json;print(len(json.load(open('sahneler.json'))),'sahne')"
      - name: Her sahnenin ilk karesi (canlı motor, çizgi film LoRA + referans karakter)
        run: python3 modal/video_ilk_kare.py sahneler.json referans.png
      - name: Sahneleri aynı anda (paralel GPU) hareketli video olarak üret (Wan 2.2, L4)
        run: timeout 5400 modal run modal/video.py --sahneler sahneler.json --seed ${{ inputs.seed }}
      - name: Video motorunu durdur (kredi yemesin)
        if: always()
        run: modal app stop -y sprite-atolye-video || true
      - name: Sonuçları kaydet (deneme-sonuclari dalı)
        if: always()
        run: |
          ls ilk_kare_*.png video_*.mp4 >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cp ilk_kare_*.png video_* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          for i in 1 2 3; do
            git fetch origin deneme-sonuclari && git checkout -f -B deneme-sonuclari origin/deneme-sonuclari
            D="video/$(date -u +%Y%m%d-%H%M)"; mkdir -p "$D" && cp /tmp/out/* "$D/"
            git add video && git commit -qm "Video denemesi $D" && git push -q origin deneme-sonuclari && break
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            ilk_kare_*.png
            video_*
          if-no-files-found: ignore
