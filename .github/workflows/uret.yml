name: Üret (elle / sipariş)

on:
  workflow_dispatch:
    inputs:
      ad:
        description: 'Dosya adı (örn: vampir-kelebek)'
        required: true
      prompt:
        description: 'İngilizce prompt'
        required: true
      stil:
        description: 'pixel veya other'
        default: 'pixel'
      n:
        description: 'Kaç aday (1-4)'
        default: '2'
      seed:
        description: 'Seed'
        default: '7'
      genislik:
        default: '1024'
      yukseklik:
        default: '1024'
      temizle:
        description: 'Otomatik temizlik (true/false)'
        default: 'true'
      referans:
        description: 'İsteğe bağlı: deneme-sonuclari dalındaki referans görselin yolu (örn: uretim/x.png)'
        default: ''
      ref_scale:
        description: 'Referans gücü (0-1)'
        default: '0.6'
      ekstra:
        description: 'Ekstra kalite / hi-res (true/false; pixel dışı stillerde)'
        default: 'false'
      yuz:
        description: 'Yüz düzeltme (true/false; pixel dışı karakterlerde)'
        default: 'false'
      motor:
        description: 'sdxl (eski) | qwen (Ressam, Qwen-Image)'
        default: 'sdxl'
      ek:
        description: 'İsteğe bağlı JSON, gövdeye eklenir (ör. hibrit: {"parts":[{"name":"nose","want":"long elephant trunk"}],"base":"cat"})'
        default: ''

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTOR_URL: https://malisah61--sprite-atolye-motor-web.us-east.modal.run
      SPRITE_KEY: ${{ secrets.SPRITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Referansı getir
        if: ${{ inputs.referans != '' }}
        env:
          IN_REF: ${{ inputs.referans }}
        run: |
          git fetch --depth 1 origin deneme-sonuclari
          git show "FETCH_HEAD:$IN_REF" > /tmp/referans.png
      - name: Üret
        env:
          IN_PROMPT: ${{ inputs.prompt }}
          IN_STIL: ${{ inputs.stil }}
          IN_N: ${{ inputs.n }}
          IN_SEED: ${{ inputs.seed }}
          IN_W: ${{ inputs.genislik }}
          IN_H: ${{ inputs.yukseklik }}
          IN_AD: ${{ inputs.ad }}
          IN_TEMIZLE: ${{ inputs.temizle }}
          IN_REF_SCALE: ${{ inputs.ref_scale }}
          IN_EKSTRA: ${{ inputs.ekstra }}
          IN_YUZ: ${{ inputs.yuz }}
          IN_EK: ${{ inputs.ek }}
          IN_MOTOR: ${{ inputs.motor }}
        run: |
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.error, time, re
          body = {
            "prompt": os.environ["IN_PROMPT"], "style": os.environ["IN_STIL"],
            "n": int(os.environ["IN_N"]), "seed": int(os.environ["IN_SEED"]),
            "width": int(os.environ["IN_W"]), "height": int(os.environ["IN_H"]),
            "auto": os.environ.get("IN_TEMIZLE", "true") == "true",
            "hires": os.environ.get("IN_EKSTRA", "false") == "true",
            "yuz": os.environ.get("IN_YUZ", "false") == "true",
          }
          if os.environ.get("IN_EK", "").strip():
              body.update(json.loads(os.environ["IN_EK"]))
          if os.path.exists("/tmp/referans.png"):
              body["reference"] = base64.b64encode(open("/tmp/referans.png", "rb").read()).decode()
              body["ref_scale"] = float(os.environ.get("IN_REF_SCALE") or 0.6)
          import sys
          sys.path.insert(0, "modal")
          from motor_istemci import cagir  # iş kuyruğu: 150 sn'yi aşan üretimler 303 döngüsüne düşmesin
          t0 = time.time()
          url = os.environ["MOTOR_URL"]
          if os.environ.get("IN_MOTOR") == "qwen":
              url = url.replace("motor-web", "ressam-web")
              try:  # uyanma süresini ayrıca ölç (sitedeki önceden uyandırma gibi)
                  t_u = time.time(); urllib.request.urlopen(url + "/", timeout=160).read()
                  print(f"uyanma (sağlık isteği): {round(time.time() - t_u)} sn")
              except Exception as e:
                  print("uyanma isteği:", e)
          d = cagir(url, "generate", body, os.environ["SPRITE_KEY"])
          ad = re.sub(r"[^a-z0-9-]", "-", os.environ["IN_AD"].lower())
          os.makedirs("/tmp/out", exist_ok=True)
          for k, im in enumerate(d["images"]):
              open(f"/tmp/out/{ad}-{os.environ['IN_STIL']}-{k+1}.png", "wb").write(base64.b64decode(im))
          msg = f"{len(d['images'])} görsel, GPU {d['seconds']} sn, toplam {round(time.time()-t0)} sn, dersler: {d.get('dersler')}, taslak→pixel: {d.get('iki_asama')}, ekstra kalite: {d.get('hires')} ({d.get('hires_seconds')} sn), yüz: {d.get('yuz')}"
          print(msg)
          print("düzeltmeler:", json.dumps(d.get("fixes"), ensure_ascii=False))
          print("çizim süreleri:", d.get("cizim_sn"), "kip:", d.get("kip"))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(msg + "\n")
          PY
      - name: Sonuçları kaydet (deneme-sonuclari dalı)
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          for i in 1 2 3; do
            git fetch origin deneme-sonuclari && git checkout -f -B deneme-sonuclari origin/deneme-sonuclari || git checkout --orphan deneme-sonuclari
            mkdir -p uretim && cp /tmp/out/*.png uretim/
            git add uretim && git commit -qm "Üretim: ${{ inputs.ad }}" && git push -q origin deneme-sonuclari && break
            sleep 5
          done
