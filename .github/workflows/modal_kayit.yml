name: Modal kayıtları (hata ayıklama)

# Uygulamanın kayıtlarını belirli süre izler; istenirse animatörü/ressamı uyandırır.
on:
  workflow_dispatch:
    inputs:
      sure:
        description: 'Kaç saniye izlensin'
        default: '300'
      uyandir:
        description: 'Animatörü ve ressamı uyandır (true/false)'
        default: 'false'

jobs:
  kayit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - run: pip install --quiet modal
      - name: Kayıtları izle
        run: |
          (timeout ${{ inputs.sure }} modal app logs sprite-atolye > kayit.txt 2>&1 &)
          sleep 5
          if [ "${{ inputs.uyandir }}" = "true" ]; then
            curl -s -w " ressam / -> %{http_code} %{time_total}s\n" --max-time 160 https://malisah61--sprite-atolye-ressam-web.us-east.modal.run/ || true
            curl -s -o /dev/null -w "animator / -> %{http_code} %{time_total}s\n" --max-time 160 https://malisah61--sprite-atolye-animator-web.us-east.modal.run/ || true
          fi
          sleep $(( ${{ inputs.sure }} + 5 ))
          grep -v "^\s*$" kayit.txt | grep -v "it/s\]" | tail -200
